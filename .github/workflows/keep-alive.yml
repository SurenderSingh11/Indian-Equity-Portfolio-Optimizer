name: Keep Streamlit App Awake

on:
  schedule:
    # Runs twice daily at 00:00 and 12:00 UTC to keep the container warm
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Open App and Auto-Wake If Sleeping
        run: |
          python -c "
          import time
          from playwright.sync_api import sync_playwright

          app_url = 'https://indian-equity-portfolio-optimizer-live.streamlit.app/'

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              
              print(f'Navigating to {app_url}...')
              page.goto(app_url, wait_until='networkidle', timeout=60000)
              time.sleep(5)

              # Look for Streamlit wake button
              wake_button = page.get_by_role('button', name='Yes, get this app back up!')
              
              if wake_button.is_visible():
                  print('Sleeping screen detected! Clicking wake button...')
                  wake_button.click()
                  time.sleep(10) # Allow container time to boot
                  print('App woken up successfully!')
              else:
                  print('App is already awake and active!')

              browser.close()
          "
