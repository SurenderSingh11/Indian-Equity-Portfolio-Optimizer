name: Keep Streamlit App Awake

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Ping Streamlit App Healthcheck
        run: |
          python -c "
          import requests

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept': '*/*'
          }

          urls = [
              'https://indian-equity-portfolio-optimizer-live.streamlit.app/_stcore/health',
              'https://indian-equity-portfolio-optimizer-live.streamlit.app/'
          ]

          session = requests.Session()
          session.headers.update(headers)

          for url in urls:
              try:
                  res = session.get(url, allow_redirects=True, timeout=15)
                  print(f'URL: {url} -> Status: {res.status_code}')
              except Exception as e:
                  print(f'Failed {url}: {e}')
          "
          echo "Keep-alive ping completed!"
