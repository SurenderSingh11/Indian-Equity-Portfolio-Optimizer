name: Keep Streamlit App Awake

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          python -c "import urllib.request; req = urllib.request.Request('https://indian-equity-portfolio-optimizer-live.streamlit.app', headers={'User-Agent': 'Mozilla/5.0'}); print(urllib.request.urlopen(req).getcode())"
          echo "Pinged Streamlit App successfully!"
