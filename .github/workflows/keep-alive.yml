name: Keep Streamlit App Awake

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -sL https://indian-equity-portfolio-optimizer-live.streamlit.app > /dev/null
          echo "Pinged Streamlit App successfully!"
